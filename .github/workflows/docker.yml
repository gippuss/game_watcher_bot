name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: game-watcher-bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Copy docker-compose and migrations to server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PROJECT_PATH: ${{ secrets.SSH_PROJECT_PATH }}
        run: |
          PROJECT_PATH=$(echo -n "$SSH_PROJECT_PATH" | tr -d '\r\n' | xargs)
          sshpass -e scp -o StrictHostKeyChecking=no -P "$SSH_PORT" docker-compose.yml "$SSH_USER@$SSH_HOST:$PROJECT_PATH/"
          sshpass -e scp -o StrictHostKeyChecking=no -P "$SSH_PORT" -r migrations "$SSH_USER@$SSH_HOST:$PROJECT_PATH/"

      - name: Deploy on server via SSH
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PROJECT_PATH: ${{ secrets.SSH_PROJECT_PATH }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          PROJECT_PATH=$(echo -n "$SSH_PROJECT_PATH" | tr -d '\r\n' | xargs)
          sshpass -e ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $PROJECT_PATH && export DOCKER_USERNAME=$DOCKER_USERNAME && docker compose pull app && docker compose up --build -d app && docker image prune -f"
